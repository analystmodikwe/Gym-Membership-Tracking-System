<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Membership Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Gym Membership Tracker</h1>
  </header>

  <main>
    <!-- Add member form -->
    <section class="card">
      <h2>Add Member</h2>
      <form id="member-form">
        <label>Name
          <input type="text" id="name" required />
        </label>

        <label>Age
          <input type="number" id="age" min="12" max="100" required />
        </label>

        <label>Gender
          <select id="gender" required>
            <option value="">Select...</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label>Plan
          <!-- options are added by app.js from /api/plans -->
          <select id="plan" required>
            <option value="">Select...</option>
          </select>
        </label>

        <label>Due date (optional)
          <input type="date" id="due-date" />
        </label>

        <label class="checkbox">
          <input type="checkbox" id="paid" /> Already paid
        </label>

        <button type="submit">Add Member</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <!-- Members table -->
    <section class="card">
      <h2>Members</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Plan</th>
              <th>Paid</th>
              <th>Due date</th>
              <th>Access</th>
              <th>Actions</th>
            </tr>
          </thead>
          <!-- rows are added by app.js -->
          <tbody id="members-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
